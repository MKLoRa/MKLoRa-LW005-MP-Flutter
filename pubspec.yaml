name: lw005_mp_flutter
description: "LW005-MP Flutter application."
publish_to: 'none'

version: 1.0.2+102

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.36.8
  permission_handler: ^12.0.1
  geolocator: ^12.0.0
  nordic_dfu:
    path: packages/nordic_dfu
  file_picker: ^10.1.9
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/images/lw005_ic_logo.png
    - assets/images/lw005_ic_voltage.png
    - assets/images/lw005_ic_current.png
    - assets/images/lw005_ic_power.png
    - assets/images/lw005_ic_power_factor.png
    - assets/images/lw005_ic_current_rate.png
    - assets/images/lw005_ic_overload.png
    - assets/images/lw005_ic_load_open.png
    - assets/images/lw005_ic_load_close.png
    - assets/images/ic_about_bg.png
